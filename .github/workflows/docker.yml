name: Docker Image CI

on:
  push:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract metadata
      id: meta
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          TAG=${GITHUB_REF#refs/tags/}
        else
          TAG=${GITHUB_REF#refs/heads/}
        fi
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Test NGINX configuration
      env:
        UPSTREAM_SERVER: owl.virtualflybrain.org:80
        CACHE_MAX_SIZE: 20g
        CACHE_STALE_TIME: 6M
        DNS_RESOLVER: 8.8.8.8
        FORCE_CACHE_REFRESH_ON_REQUEST: 0
      run: |
        envsubst '${UPSTREAM_SERVER} ${CACHE_MAX_SIZE} ${CACHE_STALE_TIME} ${DNS_RESOLVER} ${FORCE_CACHE_REFRESH_ON_REQUEST}' < nginx.conf.template > test-nginx.conf
        mkdir -p test-logs/hacks
        touch test-logs/blocked.txt test-logs/whitelist.txt test-logs/blocked-ips.map test-logs/whitelisted-ips.map
        docker run --rm \
          -v $(pwd)/test-nginx.conf:/tmp/nginx.conf \
          -v $(pwd)/test-logs:/logs \
          -v $(pwd)/test-logs/blocked-ips.map:/etc/nginx/blocked-ips.map \
          -v $(pwd)/test-logs/whitelisted-ips.map:/etc/nginx/whitelisted-ips.map \
          nginx:1.26-alpine nginx -t -c /tmp/nginx.conf
        rm -f test-nginx.conf
        rm -rf test-logs

    - name: Build test Docker image
      run: docker build --no-cache . --file Dockerfile --tag test-image

    - name: Test container startup
      env:
        UPSTREAM_SERVER: owl.virtualflybrain.org:80
        CACHE_MAX_SIZE: 20g
        CACHE_STALE_TIME: 6M
        DNS_RESOLVER: 8.8.8.8
      run: |
        docker run -d --name test-container \
          -e UPSTREAM_SERVER \
          -e CACHE_MAX_SIZE \
          -e CACHE_STALE_TIME \
          -e DNS_RESOLVER \
          test-image
        sleep 5
        if docker ps | grep -q test-container; then
          echo "Container is running successfully"
        else
          echo "Container failed to start"
          docker logs test-container
          exit 1
        fi
        docker stop test-container || true
        docker rm test-container

    - name: Build Docker image
      run: docker build . --file Dockerfile --tag virtualflybrain/owl_cache:${{ steps.meta.outputs.tag }}

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USER }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    - name: Push Docker image
      run: docker push virtualflybrain/owl_cache:${{ steps.meta.outputs.tag }}
