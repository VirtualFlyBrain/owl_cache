version: '3.8'

services:
  owlery-cache:
    image: virtualflybrain/owlery-cache:latest
    container_name: owlery-cache
    restart: unless-stopped
    environment:
      - UPSTREAM_SERVER=owl:8080
    volumes:
      # Local node disk: what nginx serves from. Size CACHE_MAX_SIZE to it.
      - /data/owl-cache:/var/cache/nginx
      # Shared NFS archive: restored from in the background at start, backed
      # up into daily at 03:00 (+ per-container jitter). See README.
      - /cache:/cache
      - /logs:/logs
    networks:
      - owlery_network
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  owlery_network:
    driver: bridge
